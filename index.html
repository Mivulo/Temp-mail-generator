<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkTempMail - Mivylo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #ffe4e1, #ffc0cb); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(219, 112, 147, 0.2); width: 100%; max-width: 480px; border: 1px solid #ffb6c1; }
        h1 { color: #d81b60; text-align: center; margin-bottom: 8px; font-size: 24px; }
        p.sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
        label { font-size: 11px; font-weight: 700; color: #e91e63; display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 8px; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #ffb6c1; border-radius: 12px; font-size: 14px; background: #fff5f7; color: #333; outline: none; font-weight: 500; }
        button { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .btn-copy { background: #e91e63; color: white; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3); }
        .btn-copy:hover { background: #c2185b; }
        .btn-action { background: #e91e63; color: white; width: 100%; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3); }
        .btn-action:hover { background: #c2185b; }
        .btn-refresh { background: #f8f9fa; color: #555; width: 100%; border: 1px solid #ddd; }
        .btn-refresh:hover { background: #e9ecef; }
        .inbox { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .inbox-header h3 { font-size: 14px; color: #333; }
        #statusText { font-size: 12px; color: #888; text-align: right; margin-bottom: 20px; }
        .inbox-list { background: #fff9fa; border: 2px dashed #ffb6c1; border-radius: 12px; padding: 20px; text-align: center; color: #888; font-size: 13px; max-height: 180px; overflow-y: auto; }
        .msg-item { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ffccd5; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .msg-from { font-size: 11px; color: #e91e63; font-weight: bold; margin-bottom: 3px; }
        .msg-subject { font-size: 13px; color: #333; font-weight: 600; }
        #copyAlert { font-size: 11px; color: #e91e63; text-align: right; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌸 Mivylo Temp Mail</h1>
        <p class="sub">Email sementara instan, aman, dan estetik.</p>

        <label>Alamat Email Anda</label>
        <div class="input-group">
            <input type="text" id="emailDisplay" readonly value="Memuat email...">
            <button class="btn-copy" onclick="copyEmail()">Salin</button>
        </div>
        <div id="copyAlert">Berhasil disalin ke clipboard!</div>
        <div id="statusText">Menghubungkan ke server...</div>

        <button class="btn-action" onclick="fetchInbox()">🔄 Cek Kotak Masuk</button>
        <button class="btn-refresh" onclick="generateEmail()">Ganti Email Baru</button>

        <div class="inbox">
            <div class="inbox-header">
                <h3>Kotak Masuk (Inbox)</h3>
            </div>
            <div id="inboxList" class="inbox-list">
                Belum ada email masuk. Pesan akan muncul di sini secara otomatis.
            </div>
        </div>
    </div>

    <script>
        let currentLogin = "";
        let currentDomain = "";

        async function generateEmail() {
            try {
                document.getElementById('statusText').innerText = "Membuat email...";
                const response = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                const data = await response.json();
                
                const fullEmail = data[0];
                const parts = fullEmail.split('@');
                currentLogin = parts[0];
                currentDomain = parts[1];

                document.getElementById('emailDisplay').value = fullEmail;
                document.getElementById('statusText').innerText = "Siap menerima pesan";
                document.getElementById('inboxList').innerHTML = "Belum ada email masuk. Pesan akan muncul di sini secara otomatis.";
            } catch (err) {
                currentLogin = 'mivylo' + Math.floor(Math.random() * 10000);
                currentDomain = '1secmail.com';
                document.getElementById('emailDisplay').value = ${currentLogin}@${currentDomain};
                document.getElementById('statusText').innerText = "Mode cadangan aktif";
            }
        }

        async function fetchInbox() {
            if (!currentLogin) return;
            try {
                document.getElementById('statusText').innerText = "Memeriksa pesan...";
                const response = await fetch(https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain});
                const messages = await response.json();
                const inboxList = document.getElementById('inboxList');

                if (!Array.isArray(messages) || messages.length === 0) {
                    inboxList.innerHTML = "Belum ada email masuk. Pesan akan muncul di sini secara otomatis.";
                } else {
                    inboxList.innerHTML = "";
                    messages.forEach(msg => {
                        inboxList.innerHTML += `
                            <div class="msg-item">
                                <div class="msg-from">${msg.from}</div>
                                <div class="msg-subject">${msg.subject}</div>
                            </div>
                        `;
                    });
                }
                document.getElementById('statusText').innerText = "Diperbarui";
            } catch (err) {
                document.getElementById('statusText').innerText = "Gagal memuat pesan";
            }
        }

        function copyEmail() {
            const copyText = document.getElementById('emailDisplay');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const alertBox = document.getElementById('copyAlert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 2000);
        }

        generateEmail();
        setInterval(() => { if (currentLogin) fetchInbox(); }, 15000);
    </script>
</body>
</html>
